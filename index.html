<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貓眼道具選物</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道具選物">
<meta name="theme-color" content="#1d1b19">
<style>
:root{--ink:#1d1b19;--paper:#f6f4f0;--card:#fff;--line:#e3ded6;--muted:#8a847b;--accent:#c9a46a;--warn:#fff4d6;--warn-line:#e8d39a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
header b{font-size:18px;white-space:nowrap}header b span{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav button{background:none;border:1px solid #555;color:#ddd;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
nav button.on{background:#fff;color:var(--ink);border-color:#fff}
#search{background:#2b2926;border:1px solid #555;color:#fff;border-radius:999px;padding:7px 14px;min-width:160px}
.done{background:var(--accent);color:var(--ink);border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}
main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 56px)}
#panel{padding:20px 18px 80px}
aside{border-left:1px solid var(--line);padding:18px;background:#fbfaf7}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
h3{border-left:4px solid var(--ink);padding-left:8px;font-size:16px;margin:22px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:15px}
.chip small{color:var(--muted);margin-left:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on small{color:#ccc}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px #0001}
.card.on{border-color:var(--ink)}
.thumb{aspect-ratio:1;background:#e9e6e1;display:flex;align-items:center;justify-content:center;text-align:center;color:#9a948b;font-size:13px;padding:8px}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .t{padding:8px 10px;font-size:14px}.card .t small{display:block;color:var(--muted);font-size:12px}
.next{margin-top:28px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:15px;cursor:pointer}
.warn{background:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.sel{font-size:14px;margin:4px 0;display:flex;justify-content:space-between;gap:6px}
.grp{margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.grp:first-of-type{border-top:0;padding-top:0}
.grp i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grp small{color:var(--muted);font-weight:400}
.sel{border-left:3px solid var(--c,#ccc);padding-left:8px}
.sel button{border:0;background:none;color:var(--muted);cursor:pointer}
.card{position:relative}
.zoom{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:#fffe;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:zoom-in;box-shadow:0 1px 3px #0003}
.peek{position:relative;margin:0 0 12px;background:#e9e6e1;border-radius:10px;overflow:hidden}
.peek img{display:block;width:100%;max-height:260px;object-fit:contain;cursor:zoom-in}
.peek p{margin:0;padding:6px 10px;font-size:13px;background:#fff}
.sel img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}
.sel span{flex:1;cursor:pointer}.sel{align-items:center}.sel.pk{background:#f1ece3}
dialog#zoomDlg{border:0;padding:0;border-radius:12px;max-width:min(92vw,820px);background:#fff}
dialog#zoomDlg::backdrop{background:#000b}
dialog#zoomDlg img{display:block;width:100%;max-height:82vh;object-fit:contain}
dialog#zoomDlg p{margin:0;padding:10px 14px;font-size:14px}
.lv{max-width:560px}.lv input{width:100%;accent-color:var(--ink);height:32px}
.lvmarks{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:2px}
.lvmarks button{border:0;background:none;cursor:pointer;color:inherit;font-size:13px;padding:4px;text-align:center}
.lvmarks b{display:block;font-size:20px;color:var(--ink)}
.lvmarks small{display:block;font-size:11px;line-height:1.3}
.lvinfo{display:flex;gap:14px;align-items:flex-start}.lvinfo svg{flex:none;width:96px;height:120px}
@media (max-width:760px){.lvmarks small{display:none}}
.lvinfo{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sv{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.sv input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;font:inherit;font-size:14px}
.sv .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.sv .row button{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.sv .row button.pri{background:var(--ink);color:#fff}
.pset{font-size:13px;display:flex;align-items:center;gap:6px;margin:4px 0;padding:6px 8px;background:#fff;border:1px solid var(--line);border-radius:8px}
.pset span{flex:1}.pset button{border:0;background:none;cursor:pointer;color:var(--ink);font-size:13px;padding:2px 4px}
.pcli{font-size:13px;font-weight:700;margin:10px 0 2px}
input.main{width:100%;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px}
label.tog{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
/* 清單頁 */
#sheet{max-width:820px;margin:0 auto;padding:28px 20px 80px;background:#fff}
.mock{aspect-ratio:3/2;background:#ece8e2;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9a948b;text-align:center;padding:20px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.items .n{display:inline-block;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-size:12px;line-height:22px;margin-right:4px}
.items small{color:var(--muted);display:block;font-size:12px}
textarea{width:100%;min-height:150px;font:14px/1.6 inherit;padding:10px;border:1px solid var(--line);border-radius:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bar button{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}
@media (max-width:760px){main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line)}
  header{gap:8px;padding:8px 12px}nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}nav button{flex:none}
  #search{flex:1;min-width:0}.done{padding:8px 12px}.grid{grid-template-columns:repeat(2,1fr)}}
@media print{header,.bar,.noprint{display:none!important}#sheet{padding:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <b>貓眼<span>道具選物</span></b>
  <nav id="nav"></nav>
  <input id="search" placeholder="搜尋：亞麻、搪瓷、黃銅…">
  <button class="done" id="finish">完成，出清單</button>
</header>
<dialog id="zoomDlg"><img alt=""><p></p></dialog>
<main id="app">
  <section id="panel"></section>
  <aside id="side"></aside>
</main>
<div id="sheetWrap" hidden></div>
<script src="props.js"></script>
<script>
// 狀態只存在這台裝置（localStorage），清掉也不影響使用
const STEPS = ['業態・風格', '角度・比例', '光調・故事', '構圖等級', ...CATS];
// 比例直接當生圖的 aspect_ratio 用
const RATIOS = [{ name: '4:5', note: '直式・IG 貼文' }, { name: '9:16', note: '直式・限動、Reels' }, { name: '1:1', note: '方形' }, { name: '3:2', note: '橫式・官網、菜單' }, { name: '16:9', note: '橫幅・封面' }];
const ratioWord = r => ({ '4:5': '直式 4:5', '9:16': '直式 9:16', '1:1': '方形 1:1', '3:2': '橫式 3:2', '16:9': '橫式 16:9' }[r] || '直式');
const blank = () => ({ 業態: '', 風格: [], 角度: '', 比例: '', 光調: '', 套餐: '', 主角: '', 構圖: '', 位置: '', 留白: '', 層次: '', 光線: '', 故事: '', props: [] });
let S = blank(), peek = '', lastWarns = [], step = 0, showAll = false, query = '';
try { S = { ...S, ...JSON.parse(localStorage.getItem('propPick') || '{}') } } catch (e) {}
const save = () => { try { localStorage.setItem('propPick', JSON.stringify(S)) } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 已選清單分組用的顏色（一類一色）
const CAT_COLOR = { 桌面: '#8b6b4a', 布料: '#c9a46a', 後景: '#7a8fa3', 容器: '#6f9a7a', 餐具: '#9a8f86', 軟裝: '#c27b6b', 墊高: '#8f7aa8' };
const ZOOM = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const level = () => CHOICES.構圖.find(l => l.name === S.構圖);
const lvInfo = () => { const l = level(); return diagram() + '<div>' + (l ? `<b>等級 ${l.name}｜${l.note}</b><p class="sub" style="margin:6px 0 0">${l.prompt}。${l.max < 99 ? `小道具（容器、餐具、軟裝、墊高）建議最多 ${l.max} 樣。` : ''}</p>` : '<b>還沒選</b><p class="sub" style="margin:6px 0 0">拉動上面的拉霸，或點數字。</p>') + '</div>'; };
const pick = k => CHOICES[k].find(o => o.name === S[k]);
// 示意圖：直式框裡畫留白區、前景、主角（大橢圓）、副菜（中橢圓）、道具（小圓），跟著等級、位置、留白、層次即時變
function diagram() {
  const l = level() || CHOICES.構圖[0], pos = pick('位置') || CHOICES.位置[1], ws = pick('留白') || {}, ly = pick('層次') || {};
  let [ax, ay, aw, ah] = [0, 0, 80, 100]; const side = ws.side;
  if (side === 'top') [ay, ah] = [32, 68]; if (side === 'bottom') ah = 68; if (side === 'left') [ax, aw] = [27, 53]; if (side === 'right') aw = 53;
  const cx = ax + aw * pos.x, cy = ay + ah * pos.y, r = (pos.big ? 34 : l.d > 1 ? 15 : 20) * (aw < 80 ? 0.85 : 1);
  let g = side ? `<rect x="${side === 'right' ? 53 : 0}" y="${side === 'bottom' ? 68 : 0}" width="${side === 'left' || side === 'right' ? 27 : 80}" height="${side === 'top' || side === 'bottom' ? 32 : 100}" fill="#fff" stroke="#c9a46a" stroke-dasharray="3 2"/><text x="${side === 'left' ? 13.5 : side === 'right' ? 66.5 : 40}" y="${side === 'top' ? 19 : side === 'bottom' ? 87 : 54}" font-size="10" text-anchor="middle" fill="#c9a46a">字</text>` : '';
  for (let i = 1; i < l.d; i++) { const a = l.d === 2 ? Math.PI / 2 : Math.PI * (0.2 + 0.6 * (i - 1) / (l.d - 2)); g += `<ellipse cx="${cx - Math.cos(a) * r * 1.8}" cy="${cy - Math.sin(a) * r * 1.45}" rx="${r * 0.55}" ry="${r * 0.4}" fill="#9a8f86"/>`; }
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r * 0.72}" fill="#1d1b19"/>`;
  for (let i = 0; i < Math.min(l.n, 8); i++) { const a = l.n === 1 ? -0.2 * Math.PI : Math.PI * (-0.2 + 1.4 * i / (l.n - 1)); g += `<circle cx="${cx + Math.cos(a) * r * 1.4}" cy="${cy + Math.sin(a) * r * 1.0}" r="3.6" fill="#c27b6b"/>`; }
  if (ly.fg) g += `<rect x="-4" y="91" width="40" height="14" rx="7" fill="#8a847b" opacity=".45" filter="url(#bl)"/>`;
  return `<svg viewBox="0 0 80 100" role="img" aria-label="構圖示意圖"><defs><clipPath id="fr"><rect width="80" height="100"/></clipPath><filter id="bl"><feGaussianBlur stdDeviation="1.6"/></filter></defs><rect width="80" height="100" fill="#efe9df" stroke="#d8d1c6"/><g clip-path="url(#fr)">${g}</g></svg>`;
}
const angle = () => CHOICES.角度.find(a => a.name === S.角度);
const thumb = p => `<div class="thumb"><img src="img/${p.id}.jpg" alt="${esc(p.name)}" onerror="this.replaceWith(this.alt)"></div>`;

function chips(key, list, multi) {
  return `<div class="chips">${list.map(o => {
    const name = o.name || o, on = multi ? S[key].includes(name) : S[key] === name;
    return `<button class="chip ${on ? 'on' : ''}" data-k="${key}" data-v="${esc(name)}" data-m="${multi ? 1 : ''}">${on ? '✓ ' : ''}${esc(name)}${o.note ? `<small>${esc(o.note)}</small>` : ''}</button>`;
  }).join('')}</div>`;
}

function renderPanel() {
  const name = STEPS[step];
  let h = '';
  if (step === 0) h = `<h2>業態・風格</h2><p class="sub">先選賣什麼、要什麼風格；後面的道具會先只顯示這些風格。</p>
    <h3>你賣的是什麼</h3>${chips('業態', CHOICES.業態)}<h3>主角菜色／商品</h3><p class="sub">寫這張圖要放的菜或商品，會直接寫進提示詞（一主二副就寫三道，主菜寫第一個）。</p><input class="main" id="mainIn" value="${esc(S.主角)}" placeholder="例：鵝肉乾麵、滷鵝肝、魚丸湯"><h3>風格（最多 2 個）</h3><p class="sub">風格太多 AI 會混在一起、什麼都不像；選 1 個最穩。</p>${chips('風格', Object.values(STYLES), true)}`;
  else if (step === 1) h = `<h2>角度</h2><p class="sub">角度決定看不看得到後景（鐵則 11）。</p>${['中式餐館／小吃','火鍋','日式料理'].includes(S.業態) ? '<div class="warn">鹹食（湯、麵、肉、小菜）建議「斜拍」或更低的 15–35 度；湯麵不要用高俯（基準第 8 條）。</div>' : ''}${chips('角度', CHOICES.角度)}<h3>圖片比例</h3><p class="sub">看圖要放哪裡：IG 貼文選 4:5，限動選 9:16。</p>${chips('比例', RATIOS)}`;
  else if (step === 2) h = `<h2>光調・故事</h2><p class="sub">光決定情緒；故事時刻會在模擬圖加上生活痕跡。</p><h3>光調（照兩頁光線食譜）</h3><p class="sub">亮調＝明亮清爽、適合麵、青菜；暗調＝暖棕有氣勢、適合切盤、湯、滷味。選了光調，下面的光線可以不選。</p>${chips('光調', CHOICES.光調)}<h3>菜色組合</h3><p class="sub">只拍一道容易單調；一主二副＝主菜在前、兩道副菜在後，畫面最豐富（基準第 17 條）。</p>${chips('套餐', CHOICES.套餐)}<h3>光線</h3>${chips('光線', CHOICES.光線)}<h3>故事時刻</h3>${chips('故事', CHOICES.故事)}`;
  else if (name === '構圖等級') {
    const i = Math.max(0, CHOICES.構圖.findIndex(l => l.name === S.構圖));
    h = `<h2>構圖等級</h2><p class="sub">畫面要放多少東西？等級越高越熱鬧；一主二副選 6，多道菜併桌選 7。圖示：黑＝主角、灰＝副菜、紅＝道具、虛線框＝放字。</p>
      <div class="lv"><input type="range" id="lv" min="0" max="${CHOICES.構圖.length - 1}" step="1" value="${i}" aria-label="構圖等級">
      <div class="lvmarks">${CHOICES.構圖.map((l, j) => `<button data-lv="${j}"><b>${l.name}</b><small>${l.note}</small></button>`).join('')}</div>
      <div class="lvinfo" id="lvInfo">${lvInfo()}</div></div>
      <h3>主體位置</h3>${chips('位置', CHOICES.位置)}
      <h3>留白與放字</h3><p class="sub">要放字時主角會變小，建議另做一張留白版；9:16 限動通常選上方留白。</p>${chips('留白', CHOICES.留白)}
      <h3>層次（前中後景）</h3><p class="sub">前景放一點失焦的東西，畫面會更有縱深。</p>${chips('層次', CHOICES.層次)}`;
  }
  else {
    // 有搜尋字時跨所有類別、所有風格找
    const filt = query ? PROPS.filter(p => (p.name + p.cat + p.style).includes(query))
      : PROPS.filter(p => p.cat === name && (showAll || !S.風格.length || S.風格.includes(p.style)));
    const styles = [...new Set(filt.map(p => p.style))];
    h = `<h2>${query ? `搜尋「${esc(query)}」` : name}</h2><p class="sub">點圖卡加入清單，再點一次取消。</p>
      ${name === '後景' && angle() && !angle().bg ? `<div class="warn">你選了「${angle().name}」：這個角度幾乎看不到後景，後景可以不選（鐵則 11）。</div>` : ''}
      <label class="tog"><input type="checkbox" id="all" ${showAll ? 'checked' : ''}> 顯示全部風格</label>
      ${styles.map(st => `<h3>${st}</h3><div class="grid">${filt.filter(p => p.style === st).map(p =>
        `<div class="card ${S.props.includes(p.id) ? 'on' : ''}" data-id="${p.id}"><button class="zoom" data-zoom="${p.id}" aria-label="放大看 ${esc(p.name)}">${ZOOM}</button>${thumb(p)}<div class="t">${esc(p.name)}<small>${esc(p.size)}</small></div></div>`).join('')}</div>`).join('') || '<p class="sub">沒有符合的道具。</p>'}`;
  }
  if (step < STEPS.length - 1) h += `<button class="next" id="nextBtn">下一步：${STEPS[step + 1]} →</button>`;
  $('#panel').innerHTML = h;
}

// 客戶模組：做得好的組合存起來，下次一鍵套用（存在這台裝置的瀏覽器；換電腦用匯出／匯入）
let lastClient = '';
const loadP = () => { try { return JSON.parse(localStorage.getItem('propPresets') || '[]') } catch (e) { return [] } };
const saveP = a => { try { localStorage.setItem('propPresets', JSON.stringify(a)) } catch (e) { alert('瀏覽器不讓儲存（可能是無痕模式），請用匯出備份。') } };
function presetBox() {
  const ps = loadP(), clients = [...new Set(ps.map(p => p.client))];
  return `<div class="sv"><h3 style="margin-top:0">客戶模組</h3><p class="sub" style="margin-bottom:6px">做到滿意的組合存起來，下次一鍵套用。只存在這台裝置的瀏覽器，換電腦請用匯出／匯入。</p>
    <input id="pvClient" placeholder="客戶名稱，例：鵝樂香" value="${esc(lastClient)}"><input id="pvName" placeholder="組合名稱，例：亮調一主二副 9:16">
    <div class="row"><button class="pri" id="pvSave">儲存目前組合</button><button id="pvExport">匯出備份</button><button id="pvImport">匯入</button></div>
    ${clients.map(c => `<div class="pcli">${esc(c)}</div>` + ps.map((p, i) => p.client !== c ? '' : `<div class="pset"><span>${esc(p.name)}<small style="color:var(--muted)">｜${esc(p.date)}</small></span><button data-load="${i}">套用</button><button data-del="${i}" aria-label="刪除 ${esc(p.name)}">刪除</button></div>`).join('')).join('') || '<p class="sub">還沒有存任何模組。</p>'}</div>`;
}

function renderSide() {
  const picked = PROPS.filter(p => S.props.includes(p.id));
  const tags = [S.業態, S.風格.join('、'), S.角度, S.比例, S.光調, S.套餐, S.構圖 && '構圖 ' + S.構圖, S.位置, S.留白, S.層次, S.光線, S.故事].filter(Boolean).join('｜');
  const warns = [];
  if (!picked.some(p => p.cat === '桌面')) warns.push('還沒選桌面。');
  if (angle() && !angle().bg && picked.some(p => p.cat === '後景')) warns.push('高角度看不到後景，後景會被忽略。');
  const small = picked.filter(p => ['容器', '餐具', '軟裝', '墊高'].includes(p.cat)).length, lv = level();
  if (lv && small > lv.max) warns.push(`構圖等級 ${lv.name} 建議小道具最多 ${lv.max} 樣，你選了 ${small} 樣。`);
  if (lv && S.套餐 === '一主二副' && +lv.name < 6) warns.push('一主二副對應構圖等級 6（或 7、8），現在的等級只放得下一道菜。');
  if (S.留白 && S.留白 !== '不留白' && S.位置 === '出血大特寫') warns.push('出血大特寫和留白放字互相衝突，建議擇一。');
  if (lv && lv.name === '8' && S.留白 && S.留白 !== '不留白') warns.push('整桌滿版會鋪滿畫面，留白放字建議改用等級 6 或 7。');
  const HARD = ['午後斑駁', '夜晚暖燈', '暗調點光'], SOFT = ['柔和窗光', '早晨陽光', '棚拍柔光', '陰天柔光'];
  if (S.光調 === '亮調' && HARD.includes(S.光線)) warns.push(`亮調是柔和窗光，和「${S.光線}」互相矛盾，光線建議不選。`);
  if (S.光調 === '暗調' && SOFT.includes(S.光線)) warns.push(`暗調是單燈壓暗，和「${S.光線}」互相矛盾，光線建議不選。`);
  if (S.光調 === '亮調' && picked.some(p => /燈光|燭/.test(p.name))) warns.push('亮調是白天窗光，燈光／燭光類後景會變成夜晚感，建議拿掉。');
  if (S.風格.length > 2) warns.push(`風格選了 ${S.風格.length} 個，最多 2 個，請取消幾個。`);
  if (!S.主角) warns.push('還沒寫主角菜色（第 ① 步），提示詞會不知道要放什麼。');
  lastWarns = warns.filter(w => w !== '還沒選桌面。' || !S.構圖 || +S.構圖 > 1);
  const pk = picked.find(p => p.id === peek) || picked[picked.length - 1];
  $('#side').innerHTML = `<h2 style="font-size:17px">已選 ${picked.length} 樣</h2><p class="sub">${esc(tags) || '還沒選業態和風格。'}</p>
    ${pk ? `<div class="peek"><img src="img/${pk.id}.jpg" alt="${esc(pk.name)}" data-zoom="${pk.id}"><button class="zoom" data-zoom="${pk.id}" aria-label="放大看 ${esc(pk.name)}">${ZOOM}</button><p>${esc(pk.name)}<small style="color:var(--muted)">｜${esc(pk.size)}</small></p></div>` : ''}
    ${CATS.filter(c => picked.some(p => p.cat === c)).map(c => `<div class="grp"><i style="background:${CAT_COLOR[c]}"></i>${c}<small>${picked.filter(p => p.cat === c).length}</small></div>` +
      picked.filter(p => p.cat === c).map(p => `<div class="sel ${p === pk ? 'pk' : ''}" style="--c:${CAT_COLOR[c]}"><img src="img/${p.id}.jpg" alt=""><span data-peek="${p.id}">${esc(p.name)}<small style="color:var(--muted)">｜${esc(p.style)}</small></span><button data-rm="${p.id}" aria-label="移除">✕</button></div>`).join('')).join('') || '<p class="sub">還沒挑東西。</p>'}
    ${warns.map(w => `<div class="warn">${w}</div>`).join('')}
    <div class="bar"><button id="reset">全部清空</button></div>
    ${presetBox()}`;
  $('#finish').textContent = lastWarns.length ? `完成，出清單（${lastWarns.length} 個提醒）` : '完成，出清單';
}

function renderNav() {
  $('#nav').innerHTML = STEPS.map((s, i) => `<button class="${i === step ? 'on' : ''}" data-step="${i}">${'①②③④⑤⑥⑦⑧⑨⑩⑪'[i]} ${s}</button>`).join('');
}
const render = () => { renderNav(); renderPanel(); renderSide(); save(); };

// 組模擬圖提示詞：照 03_套餐提示詞 的寫法與共用結尾
function buildPrompt(picked) {
  const by = c => picked.filter(p => p.cat === c).map(p => p.name).join('、');
  const a = angle(), light = CHOICES.光線.find(l => l.name === S.光線), story = CHOICES.故事.find(s => s.name === S.故事);
  const tone = CHOICES.光調.find(t => t.name === S.光調), set = CHOICES.套餐.find(t => t.name === S.套餐);
  const parts = ['商品攝影情境模擬圖，' + (S.風格.join('＋') || '') + '風格，主角是' + (S.主角 ? `「${S.主角}」（第一個是主角）` : '【' + (S.業態 || '主角品項') + '的主角品項】') + '，放在畫面視覺中心。'];
  if (by('桌面')) parts.push(`桌面：${by('桌面')}${a && !a.bg ? '，桌面充滿整個畫面，看不到牆面、桌緣或窗戶' : ''}。`);
  if (by('布料')) parts.push(`布料：${by('布料')}，自然皺摺。`);
  if (by('後景') && (!a || a.bg)) parts.push(`後景：${by('後景')}，略為失焦。`);
  const props = ['容器', '餐具', '軟裝', '墊高'].map(by).filter(Boolean).join('、');
  if (props) parts.push(`道具：${props}，每樣都小、不搶主角，畫面飽滿但有秩序，四角有小物收邊。`);
  if (set && set.prompt) parts.push(`${set.prompt}。`);
  if (tone) parts.push(`${tone.prompt}。`);
  if (level()) parts.push(`構圖：${level().prompt}。`);
  ['位置', '留白', '層次'].map(pick).filter(o => o && o.prompt).forEach(o => parts.push(`${o.prompt}。`));
  if (light) parts.push(`光線：${light.prompt}。`);
  if (story && story.prompt) parts.push(`${story.prompt}。`);
  if (a) parts.push(`鏡頭：約 ${a.deg} 度${a.deg >= 90 ? '正俯拍' : '俯角'}，中長焦無變形，${ratioWord(S.比例)}。`);
  else if (S.比例) parts.push(`畫面比例：${ratioWord(S.比例)}。`);
  parts.push('如果畫面有飲料，只有一杯，而且必須是店家有賣的。包裝與道具上不要出現任何文字、logo 或圖案。不要人物、不要人臉。所有物件的陰影朝同一個方向。');
  return parts.join('\n');
}

// 給 Claude 的工作單：一段貼上就能報價、生圖的文字
function buildJob(subj) {
  const picked = PROPS.filter(p => S.props.includes(p.id));
  const lines = ['【貓眼道具選物｜生圖工作單】',
    `模式：${subj ? 'B 路線：客戶主體照重畫（照片附在這則訊息；店家已書面同意）' : '只要模擬圖（不放客戶主體）'}`,
    `主角菜色：${S.主角 || '未填'}`,
    `業態／風格：${S.業態 || '未選'}｜${S.風格.join('＋') || '不限'}`,
    `比例：${S.比例 || '未選（預設 4:5）'}`,
    `構圖細節：${[S.位置, S.留白, S.層次].filter(Boolean).join('｜') || '未選'}`,
    `光調／組合／構圖：${[S.光調, S.套餐, S.構圖 && '等級 ' + S.構圖].filter(Boolean).join('｜') || '未選'}`,
    `角度／光線／故事：${[S.角度, S.光線, S.故事].filter(Boolean).join('｜') || '未選'}`,
    `道具（${picked.length} 樣）：${picked.map(p => p.name).join('、') || '無'}`,
    '', '提示詞：', $('#prompt').value, '',
    '請照作業規則：先報價等我回 k；' + (subj ? '出圖後做三道鎖對照驗收頁；' : '') + '出圖要過鐵則 11 角度檢查與基準 18 條（作業規則第九節）。'];
  return lines.join('\n');
}

function renderSheet() {
  const picked = PROPS.filter(p => S.props.includes(p.id));
  const sur = picked.filter(p => ['桌面', '布料', '後景'].includes(p.cat)), rest = picked.filter(p => !sur.includes(p));
  const today = new Date().toISOString().slice(0, 10);
  const block = (title, list, start) => list.length ? `<h3>${title}</h3><div class="items">${list.map((p, i) =>
    `<div>${thumb(p)}<div style="margin-top:6px"><span class="n">${start + i + 1}</span>${esc(p.name)}<small>${esc(p.size)}｜${esc(p.style)}｜${p.status}</small></div></div>`).join('')}</div>` : '';
  $('#sheetWrap').innerHTML = `<div id="sheet">
    <div class="bar noprint"><button id="back">← 回去改</button><button onclick="print()">列印／存 PDF</button><button id="copy">複製提示詞</button></div>
    <p style="letter-spacing:.2em;color:var(--muted);font-size:12px;margin:0">CATEYES STUDIO ・ PROP LIST ・ ${today}</p>
    <h2 style="font-size:24px;margin:6px 0">${esc(S.業態 || '未命名')}｜${esc(S.風格.join('＋') || '不限風格')}</h2>
    <p class="sub">${esc([S.角度, S.比例, S.光調, S.套餐, S.構圖 && '構圖 ' + S.構圖, S.位置, S.留白, S.層次, S.光線, S.故事].filter(Boolean).join('｜'))}</p>
    <div class="mock"><img src="img/mock.jpg" style="width:100%;height:100%;object-fit:cover;border-radius:6px" alt="模擬圖：把下方提示詞貼給 Claude，報價確認後生成，存成 img/mock.jpg 就會顯示在這裡" onerror="this.replaceWith(this.alt)"></div>
    <p class="sub" style="font-size:12px">模擬圖｜依本清單生成，實際拍攝以實物為準。道具圖為 AI 生成，拍攝前請確認實物。</p>
    ${block('桌面・布料・後景', sur, 0)}${block('容器・餐具・軟裝・墊高', rest, sur.length)}
    <div class="noprint">
      <h3>送給 Claude 生圖（半自動）</h3>
      <p class="sub">照片只會留在這支手機／電腦的瀏覽器裡，不會上傳到網站。</p>
      <label class="tog"><input type="radio" name="mode" value="mock" checked> 只要模擬圖（不放客戶的主體）</label><br>
      <label class="tog"><input type="radio" name="mode" value="subject"> 要放客戶的主體照片（B 路線：重畫＋三道鎖）</label>
      <div id="subjectBox" hidden>
        <input type="file" id="subjectFile" accept="image/*">
        <img id="subjectPreview" alt="主體照預覽" hidden style="max-width:220px;border-radius:6px;margin:8px 0;display:block">
        <label class="tog"><input type="checkbox" id="consent"> 店家已書面同意照片上傳到生圖服務（交付規則 1）</label>
      </div>
      <div class="bar"><button id="copyJob">① 複製工作單</button></div>
      <p class="sub">② 回到 Claude 對話，貼上工作單${'，並把主體照片拖進對話'}；③ Claude 報價，你回「k」才會生圖。</p>
      <h3>模擬圖提示詞（已照共用結尾組好，送出前再校對一次）</h3>
      <textarea id="prompt">${esc(buildPrompt(picked))}</textarea>
    </div>
    <p class="sub" style="margin-top:24px">貓眼影像 CATEYES STUDIO　共 ${picked.length} 樣道具</p></div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-load],[data-del],#pvSave,#pvExport,#pvImport,[data-zoom],[data-peek],[data-lv],[data-k],[data-id],[data-step],[data-rm],#nextBtn,#finish,#back,#reset,#copy,#copyJob');
  if (!t) return;
  if (t.id === 'pvSave') {
    const client = $('#pvClient').value.trim(), name = $('#pvName').value.trim();
    if (!client || !name) { alert('請填客戶名稱和組合名稱。'); return; }
    const ps = loadP(), i = ps.findIndex(p => p.client === client && p.name === name);
    if (i >= 0 && !confirm(`「${client}／${name}」已經存過，要覆蓋嗎？`)) return;
    const rec = { client, name, date: new Date().toLocaleDateString('zh-TW'), state: JSON.parse(JSON.stringify(S)) };
    if (i >= 0) ps[i] = rec; else ps.push(rec);
    saveP(ps); lastClient = client; renderSide(); return;
  }
  if (t.dataset.load) { const p = loadP()[+t.dataset.load]; if (p && confirm(`套用「${p.client}／${p.name}」？目前的選擇會被取代。`)) { S = { ...blank(), ...p.state }; lastClient = p.client; step = 0; render(); } return; }
  if (t.dataset.del) { const ps = loadP(), p = ps[+t.dataset.del]; if (p && confirm(`刪除「${p.client}／${p.name}」？`)) { ps.splice(+t.dataset.del, 1); saveP(ps); renderSide(); } return; }
  if (t.id === 'pvExport') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(loadP(), null, 1)], { type: 'application/json' })); a.download = '貓眼道具選物_客戶模組.json'; a.click(); return; }
  if (t.id === 'pvImport') { const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json'; f.onchange = () => f.files[0].text().then(txt => { try { const add = JSON.parse(txt).filter(p => p && p.client && p.name && p.state); const ps = loadP(); add.forEach(p => { const i = ps.findIndex(x => x.client === p.client && x.name === p.name); if (i >= 0) ps[i] = p; else ps.push(p); }); saveP(ps); renderSide(); alert(`匯入 ${add.length} 組。`); } catch (e) { alert('檔案格式不對，請選之前匯出的 .json。'); } }); f.click(); return; }
  if (t.dataset.zoom) { const p = PROPS.find(x => x.id === t.dataset.zoom), d = $('#zoomDlg'); d.querySelector('img').src = `img/${p.id}.jpg`; d.querySelector('img').alt = p.name; d.querySelector('p').textContent = `${p.name}｜${p.size}｜${p.style}`; d.showModal(); return; }
  if (t.dataset.peek) { peek = t.dataset.peek; renderSide(); return; }
  if (t.dataset.lv) { S.構圖 = CHOICES.構圖[+t.dataset.lv].name; render(); return; }
  if (t.dataset.k) {
    const k = t.dataset.k, v = t.dataset.v;
    if (k === '風格' && !S[k].includes(v) && S[k].length >= 2) { alert('風格最多選 2 個，先取消一個再選。'); return; }
    if (t.dataset.m) S[k] = S[k].includes(v) ? S[k].filter(x => x !== v) : [...S[k], v];
    else S[k] = S[k] === v ? '' : v;
  } else if (t.dataset.id) { const id = t.dataset.id; S.props = S.props.includes(id) ? S.props.filter(x => x !== id) : [...S.props, id]; peek = S.props.includes(id) ? id : ''; }
  else if (t.dataset.step) { step = +t.dataset.step; $('#app').hidden = false; $('#sheetWrap').hidden = true; }
  else if (t.dataset.rm) S.props = S.props.filter(x => x !== t.dataset.rm);
  else if (t.id === 'nextBtn') { step++; scrollTo(0, 0); }
  else if (t.id === 'reset') { if (confirm('確定全部清空？')) S = blank(); }
  else if (t.id === 'finish') { if (lastWarns.length && confirm(`還有 ${lastWarns.length} 個提醒：\n・${lastWarns.join('\n・')}\n\n按「確定」回去修，按「取消」照樣出清單。`)) return; renderSheet(); $('#app').hidden = true; $('#sheetWrap').hidden = false; scrollTo(0, 0); return; }
  else if (t.id === 'back') { $('#app').hidden = false; $('#sheetWrap').hidden = true; return; }
  else if (t.id === 'copyJob') {
    const subj = document.querySelector('input[name=mode]:checked').value === 'subject';
    if (subj && !$('#subjectFile').files.length) { alert('請先選主體照片，或改選「只要模擬圖」。'); return; }
    if (subj && !$('#consent').checked) { alert('要先取得店家書面同意，才能把客戶照片送去生圖（交付規則 1）。'); return; }
    navigator.clipboard.writeText(buildJob(subj)).then(() => t.textContent = '已複製 ✓ 回對話貼上');
    return;
  }
  else if (t.id === 'copy') { navigator.clipboard.writeText($('#prompt').value).then(() => t.textContent = '已複製 ✓'); return; }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'all') { showAll = e.target.checked; renderPanel(); }
  if (e.target.name === 'mode') $('#subjectBox').hidden = e.target.value !== 'subject';
  if (e.target.id === 'subjectFile' && e.target.files[0]) { const im = $('#subjectPreview'); im.src = URL.createObjectURL(e.target.files[0]); im.hidden = false; }
});
// 拉霸：拖動時只更新說明與右側，不重畫整頁（重畫會中斷拖動）
document.addEventListener('input', e => {
  if (e.target.id === 'mainIn') { S.主角 = e.target.value.trim(); renderSide(); save(); return; }
  if (e.target.id === 'pvClient') { lastClient = e.target.value.trim(); return; }
  if (e.target.id !== 'lv') return;
  S.構圖 = CHOICES.構圖[+e.target.value].name; $('#lvInfo').innerHTML = lvInfo(); renderSide(); save();
});
$('#zoomDlg').addEventListener('click', e => e.currentTarget.close());
$('#search').addEventListener('input', e => { query = e.target.value.trim(); render(); });
render();
</script>
